name: WEB9000 v2 protocol
on:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/web9000-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/web9000-v2.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check v2/app.js
          node --check v2/core/events.js
          node --check v2/core/policy.js
          node --check v2/core/content-ratings.js
          node --check v2/core/reviewer-reputation.js
          node --check v2/test/content-ratings.test.js
          node --check v2/test/reviewer-reputation.test.js
          node --check v2/core/replica.js
          node --check v2/network/node-peer.mjs
          node --check v2/network/signed-access-controller.js
          node --check v2/network/raw-index-selection.mjs
          node --check v2/network/migrate-verified-events.mjs
          node --check v2/network/migrate-raw-index.mjs
          node --check v2/core/governance.js
          node --check v2/core/group-proof.js
          node --check v2/network/verify-group-proof.mjs
          node --check v2/core/reputation.js
          node --check v2/network/smoke.mjs
          node --check v2/core/media.js
          node --check v2/core/media-policy.js
          node --check v2/test/media-policy.test.js
          node --check v2/network/browser-mesh.js
          node --check v2/network/source-feed.js
          node --check v2/network/source-receipt.js
          node --check v2/network/source-feed-operator.mjs
          node --check v2/network/source-feed.test.mjs
          node --check v2/network/source-feed-bundle.js
          node --check v2/network/source-feed-bundle.test.mjs
          node --check v2/network/source-feed-import.mjs
          node --check v2/network/source-feed-import.test.mjs
          node --check v2/network/source-provenance.js
          node --check v2/network/source-provenance-files.mjs
          node --check v2/network/source-provenance.test.mjs
          node --check v2/network/source-refresh-stage.mjs
          node --check v2/network/source-refresh-stage.test.mjs
          node --check v2/network/source-feed-refresh.mjs
          node --check v2/network/benchmark-source-feed-browser.mjs
          node --check v2/network/node-source-observer.mjs
          node --check v2/network/scoped-sync.test.mjs
          node --check v2/network/browser-bridge.mjs
          node --check v2/network/scoped-event-catalog.mjs
          node --check v2/network/scoped-event-catalog.test.mjs
          node --check v2/network/bridge-indexed-sync.test.mjs
          node --check v2/network/reconcile-mirrors.mjs
          node --check v2/network/bridge-reconciliation.test.mjs
          node --check v2/network/peer-inventory-client.js
          node --check v2/network/peer-inventory-client.test.mjs
          node --check v2/network/benchmark-orbitdb-tiers.mjs
          node --check v2/network/benchmark-orbitdb-tier-sync.mjs
          node --check v2/network/benchmark-ipfs-tiers.mjs
          node --check v2/network/benchmark-ipfs-tier-bitswap.mjs
          node --check v2/network/adaptive-tier-router.mjs
          node --check v2/network/adaptive-tier-router.test.mjs
          node --check v2/network/source-compartments.mjs
          node --check v2/network/source-compartments.test.mjs
          node --check v2/network/signed-shard-directory.mjs
          node --check v2/network/signed-shard-directory.test.mjs
          node --check v2/network/priority-shard-loader.mjs
          node --check v2/network/priority-shard-loader.test.mjs
          node --check v2/network/benchmark-priority-recovery.mjs
          node --check v2/network/isolated-tier-worker.mjs
          node --check v2/network/isolated-tier-worker.test.mjs
          node --check v2/network/ingress-capability.mjs
          node --check v2/network/bounded-ingress.mjs
          node --check v2/network/isolated-ingress-process.mjs
          node --check v2/network/bounded-ingress.test.mjs
          node --check v2/network/operator-trust-proof.mjs
          node --check v2/network/operator-trust-proof.test.mjs
          node --check v2/network/operator-proof-service.mjs
          node --check v2/network/operator-proof-service.test.mjs
          node --check v2/network/isolated-proof-issuer.mjs
          node --check v2/network/stake4karma-testnet-verifier.mjs
          node --check v2/network/stake4karma-testnet-verifier.test.mjs
          node --check v2/network/vendor/stake4karma-sdk-v0.5.0.mjs
          node --check v2/network/deploy/bootstrap-lab.mjs
          node --check v2/network/smoke-browser.mjs
          node --check v2/network/smoke-islands.mjs
          node --check v2/network/mirror-policy.js
          node --check v2/network/peer-identity.mjs
          node --check v2/network/peer-identity.test.mjs
          node --check v2/network/smoke-ui.mjs
          node --check v2/classic.js
          node --check v2/network/smoke-classic.mjs
          node --check v2/network/media-node.mjs
          node --check v2/network/media-bitswap-policy.mjs
          node --check v2/network/mirror-media.mjs
          node --check v2/network/media-quarantine.mjs
          node --check v2/network/announce-media.mjs
          node --check v2/core/media-discovery.js
          node --check v2/core/debug-console.js
          node --check v2/core/social-relations.js
          node --check v2/network/qualified-index.js
          node --check v2/network/smoke-qualified.mjs
      - name: Protocol and view tests
        working-directory: v2
        run: npm test

  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OrbitDB and libp2p experiment dependencies
        working-directory: v2/network
        run: npm install --no-audit --no-fund
      - name: Persist and reload unique libp2p peer identities
        working-directory: v2/network
        run: npm run test:peer-identity
      - name: Reject forged direct OrbitDB appends with optional signed index controller
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:signed-index
      - name: Offline legacy-to-signed migration dry-run, checkpoint verification and resume
        working-directory: v2/network
        timeout-minutes: 2
        run: npm run test:migration
      - name: Two real Helia/libp2p peers replicate signed records
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:peers
      - name: Browser WebSocket clients replicate through separate libp2p peers
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:browser-bridge
      - name: Indexed namespace paging with frozen local snapshots and concurrent live events
        working-directory: v2/network
        timeout-minutes: 1
        run: npm run test:indexed-sync
      - name: Read-only independent-peer inventory comparison and explicitly approved repair
        working-directory: v2/network
        timeout-minutes: 1
        run: npm run test:reconciliation
      - name: Reject out-of-scope signed events from misbehaving peer bridges
        working-directory: v2/network
        timeout-minutes: 1
        run: npm run test:scopes
      - name: Verify IP-source observer feeds and cross-browser isolated network compartments
        working-directory: v2/network
        timeout-minutes: 2
        run: npm run test:source-observation
      - name: Unrelated OrbitDB indexes joined only by optional browser mirroring
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:independent-indexes
      - name: Physically separate raw and curator-qualified OrbitDB indexes
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:qualified
      - name: Adaptively partition real curated OrbitDB indexes without trusting self-claimed karma
        working-directory: v2/network
        timeout-minutes: 2
        run: npm run test:adaptive-tiers
      - name: Prioritize bounded physical shard subscriptions and verify real stored history
        working-directory: v2/network
        timeout-minutes: 2
        run: npm run test:priority-tiers
      - name: Kill flooded entry worker without taking down independently curated Helia peer
        working-directory: v2/network
        timeout-minutes: 2
        run: npm run test:isolated-worker
      - name: Bound pre-OrbitDB traffic and verify isolated entry and protected ingress processes
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:ingress
      - name: Verify rooted signed invitations, group ratifications and pinned Base Sepolia testnet collateral
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:proof-qualification
      - name: Real headless Chromium browser across independent HTTP origins
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:browser-ui
      - name: Real Helia IPFS raw images and chunked UnixFS audio/video with byte-range seeks
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:media
      - name: Reject quarantined raw and UnixFS child blocks via real libp2p Bitswap
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:media-bitswap
      - name: Signed voluntary media-provider announcements through replaceable peer bridge
        working-directory: v2/network
        run: npm run test:media-providers
      - name: Real classic board UI across two website origins
        working-directory: v2/network
        timeout-minutes: 4
        run: npm run test:classic-ui
      - name: Upload real browser screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web9000-v2-browser-preview
          path: v2/network/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7