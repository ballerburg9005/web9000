name: WEB9000 v2 protocol
on:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/web9000-v2.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/web9000-v2.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check v2/app.js
          node --check v2/core/events.js
          node --check v2/core/policy.js
          node --check v2/core/replica.js
          node --check v2/network/node-peer.mjs
          node --check v2/core/governance.js
          node --check v2/core/reputation.js
          node --check v2/network/smoke.mjs
          node --check v2/core/media-policy.js
          node --check v2/test/media-policy.test.js
          node --check v2/network/browser-mesh.js
          node --check v2/network/browser-bridge.mjs
          node --check v2/network/smoke-browser.mjs
          node --check v2/network/smoke-islands.mjs
          node --check v2/network/mirror-policy.js
          node --check v2/network/peer-identity.mjs
          node --check v2/network/peer-identity.test.mjs
          node --check v2/network/smoke-ui.mjs
          node --check v2/classic.js
          node --check v2/network/smoke-classic.mjs
          node --check v2/network/media-node.mjs
      - name: Protocol and view tests
        working-directory: v2
        run: npm test

  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OrbitDB and libp2p experiment dependencies
        working-directory: v2/network
        run: npm install --no-audit --no-fund
      - name: Persist and reload unique libp2p peer identities
        working-directory: v2/network
        run: npm run test:peer-identity
      - name: Two real Helia/libp2p peers replicate signed records
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:peers
      - name: Browser WebSocket clients replicate through separate libp2p peers
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:browser-bridge
      - name: Unrelated OrbitDB indexes joined only by optional browser mirroring
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:independent-indexes
      - name: Real headless Chromium browser across independent HTTP origins
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:browser-ui
      - name: Real classic board UI across two website origins
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:classic-ui
      - name: Real Helia IPFS media upload, retrieve and refusals
        working-directory: v2/network
        timeout-minutes: 3
        run: npm run test:media
      - name: Upload real browser screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web9000-v2-browser-preview
          path: v2/network/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
