worker_processes 1;
worker_rlimit_nofile 256;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 96; multi_accept off; }
http {
 access_log off; server_tokens off;
 limit_req_zone $binary_remote_addr zone=protectedip:1m rate=12r/s;
 limit_conn_zone $binary_remote_addr zone=protectedconn:1m;
 server {
  listen 8080;
  client_max_body_size 48k;client_body_timeout 3s;
  client_header_timeout 3s;send_timeout 3s;keepalive_timeout 1s;
  limit_req_status 429;limit_conn_status 429;
  location = /publish {
   limit_req zone=protectedip burst=16 nodelay;
   limit_conn protectedconn 4;
   limit_except POST { deny all; }
   proxy_request_buffering on;proxy_http_version 1.1;
   proxy_connect_timeout 1s;proxy_read_timeout 4s;proxy_send_timeout 4s;
   proxy_set_header Connection close;proxy_set_header Host localhost;
   proxy_set_header X-Forwarded-For "";proxy_set_header X-Real-IP "";
   if ($http_x_w9_operator_capability = "") { return 403; }
   proxy_set_header X-W9-Operator-Capability $http_x_w9_operator_capability;
   proxy_pass http://127.0.0.1:18765/publish;
  }
  location / { return 404; }
 }
}
