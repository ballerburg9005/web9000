worker_processes 1;
worker_rlimit_nofile 256;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 64; multi_accept off; }
http {
 access_log off; server_tokens off;
 limit_req_zone $binary_remote_addr zone=proofip:1m rate=3r/s;
 limit_conn_zone $binary_remote_addr zone=proofconn:1m;
 server {
  listen 8080;
  client_max_body_size 48k;client_body_timeout 3s;
  client_header_timeout 3s;send_timeout 3s;keepalive_timeout 1s;
  limit_req_status 429;limit_conn_status 429;
  location = /qualify {
   limit_req zone=proofip burst=4 nodelay;
   limit_conn proofconn 2;
   limit_except POST { deny all; }
   proxy_request_buffering on;proxy_http_version 1.1;
   proxy_connect_timeout 1s;proxy_read_timeout 5s;proxy_send_timeout 5s;
   proxy_set_header Connection close;proxy_set_header Host localhost;
   proxy_set_header X-Forwarded-For "";proxy_set_header X-Real-IP "";
   proxy_pass http://127.0.0.1:18767/qualify;
  }
  location = /challenge {
   limit_req zone=proofip burst=4 nodelay;
   limit_conn proofconn 2;
   limit_except POST { deny all; }
   proxy_request_buffering on;proxy_http_version 1.1;
   proxy_connect_timeout 1s;proxy_read_timeout 5s;proxy_send_timeout 5s;
   proxy_set_header Connection close;proxy_set_header Host localhost;
   proxy_set_header X-Forwarded-For "";proxy_set_header X-Real-IP "";
   proxy_pass http://127.0.0.1:18767/challenge;
  }
  location / { return 404; }
 }
}
